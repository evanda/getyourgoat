name = "get-your-goat-alpha"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Filled in by `npx wrangler kv namespace create SUBMISSIONS`.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "REPLACE_WITH_KV_ID"

[vars]
ALLOWED_ORIGINS = "https://www.remingtons.org,http://www.remingtons.org,http://localhost:5174"

# EXPORT_TOKEN is a secret: `npx wrangler secret put EXPORT_TOKEN`
